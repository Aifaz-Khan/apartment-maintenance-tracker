services:
  postgres:
    image: postgres:17-alpine
    container_name: maintenance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maintenance_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maintenance_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
