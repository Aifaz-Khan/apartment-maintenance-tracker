spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maintenance_tracker}
    username: ${DB_USERNAME:maintenance_app}
    password: ${DB_PASSWORD:maintenance_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.example.maintenance: DEBUG
    org.flywaydb: INFO
    org.hibernate: INFO
