spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maintenance_tracker}
    username: ${DB_USERNAME:maintenance_app}
    password: ${DB_PASSWORD:maintenance_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: test-signing-key-for-maintenance-tracker-at-least-32-chars
      issuer: maintenance-tracker
      expiration-seconds: 86400
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  superadmin:
    bootstrap:
      enabled: false
    email: test-admin@example.com
    password: TestAdmin@12345

logging:
  level:
    com.example.maintenance: DEBUG
    org.flywaydb: INFO
    org.hibernate: INFO
