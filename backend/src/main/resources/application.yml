spring:
  application:
    name: maintenance-tracker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maintenance_tracker}
    username: ${DB_USERNAME:maintenance_app}
    password: ${DB_PASSWORD:maintenance_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-jwt-signing-key-change-before-deploy-32chars}
      issuer: maintenance-tracker
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  superadmin:
    bootstrap:
      enabled: ${SUPERADMIN_BOOTSTRAP_ENABLED:true}
    email: ${SUPERADMIN_EMAIL:superadmin@maintenancetracker.com}
    password: ${SUPERADMIN_PASSWORD:Admin@12345}
